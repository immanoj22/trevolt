<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdrawal whitelist and spotting phishing</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0B1F3A,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}main{padding:6vmin;max-width:640px}small{color:#BFDBFE;letter-spacing:.12em;font-size:3.2vmin}h1{font-size:7vmin;margin:.4em 0}p{color:#DBEAFE;font-size:3.6vmin;line-height:1.5}</style></head><body><main><small>TREVOLT LEARN</small><h1>Withdrawal whitelist and spotting phishing</h1><p>A withdrawal whitelist restricts transfers to bank accounts you approved, so an attacker who gains access still cannot send funds elsewhere. New addresses may carry a cooling-off period.</p></main></body></html>
