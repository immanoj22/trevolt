<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What is a forex CFD?</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0B1F3A,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}main{padding:6vmin;max-width:640px}small{color:#BFDBFE;letter-spacing:.12em;font-size:3.2vmin}h1{font-size:7vmin;margin:.4em 0}p{color:#DBEAFE;font-size:3.6vmin;line-height:1.5}</style></head><body><main><small>TREVOLT LEARN</small><h1>What is a forex CFD?</h1><p>A forex CFD is a contract that tracks the price of a currency pair such as EURUSD, with no expiry date. You can go long or short using margin, so you gain or lose based on price changes without owning the currency.</p></main></body></html>
