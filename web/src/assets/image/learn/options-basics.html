<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Options basics: calls, puts and premium</title><style>body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0B1F3A,#2563EB);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}main{padding:6vmin;max-width:640px}small{color:#BFDBFE;letter-spacing:.12em;font-size:3.2vmin}h1{font-size:7vmin;margin:.4em 0}p{color:#DBEAFE;font-size:3.6vmin;line-height:1.5}</style></head><body><main><small>TREVOLT LEARN</small><h1>Options basics: calls, puts and premium</h1><p>An option gives the buyer the right, not the obligation, to trade at a strike price by expiry. A call profits when price rises above the strike plus premium; a put profits when price falls below the strike minus premium.</p></main></body></html>
